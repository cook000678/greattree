services:
  # GreatTree 專案 PHP 7.2.34 伺服器
  gt-app:
    build: .
    container_name: gt_php72_server
    ports:
      - "80:80" # http://localhost
    volumes:
      - .:/var/www/html/greattree
      - ../Tools:/var/www/html/Tools
    networks:
      - gt-network
      - company-network

networks:
  gt-network:
    driver: bridge
  company-network:
    external: true
